on: workflow_dispatch
name: Build release apk

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17.x'

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Optional: sign with your own key. Add these repository secrets:
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS.
      # Without them the APK is still built (signed with the debug key).
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
            } > android/key.properties
            echo "Using the release key from secrets."
          else
            echo "No release key secrets found, using the debug key."
          fi

      - run: flutter pub get
      - run: flutter analyze . --no-fatal-infos

      # Release (not debug) universal apk.
      - run: flutter build apk --release --flavor github

      - name: Rename apk
        run: cp build/app/outputs/flutter-apk/app-github-release.apk Skyfy.apk

      - uses: actions/upload-artifact@v5
        with:
          name: Skyfy-release
          path: Skyfy.apk
